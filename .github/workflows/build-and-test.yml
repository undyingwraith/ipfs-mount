name: 'Build & Test'
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Check code style
        run: cargo fmt -- --check
      - name: Check warnings
        if: success() || failure()
        run: cargo clippy -- -D warnings
      - name: Build
        if: success() || failure()
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
